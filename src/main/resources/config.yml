# ArcaneCore configuration.
# Player data (levels, trusts, owned arcanes) is stored separately in
# levels.yml / trusts.yml / arcanes.yml and is NOT kept in this file.

levels:
  max-level: 4
  ability-unlock-level: 3

breeze:
  cooldown-seconds: 25
  dash-distance:
    level-3: 5.0
    level-4: 8.0
  dash-damage: 4.0
  hit-radius: 2.8
  damage-window-ticks: 30

luck:
  cooldown-seconds: 60
  active-hits: 5
  negates:
    level-3: 2
    level-4: 3

frost:
  cooldown-seconds: 75
  radius:
    level-3: 5
    level-4: 10
  freeze-duration:
    level-3: 3
    level-4: 3
  total-damage:
    level-3: 0.0
    level-4: 4.0

ember:
  cooldown-seconds: 120
  beam-range: 15
  hit-radius: 1.3
  fire-ticks:
    level-3: 80
    level-4: 120
  damage:
    level-3: 8.0
    level-4: 10.0

void:
  passive:
    extra-hearts: 5
  flight:
    launch-strength: 1.6
    fly-speed: 0.22
    duration-seconds: 3
    cooldown-seconds: 30
  breath:
    duration-ticks: 60
    total-damage: 12.0
    range: 10
    max-width: 6.0
    cooldown-seconds: 60

trader-chances:
  breeze: 25
  frost: 25
  ember: 25
  luck: 25
