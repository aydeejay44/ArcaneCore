# ArcaneCore configuration.
# Player data is stored separately in levels.yml / trusts.yml / arcanes.yml.
# Damage values use Minecraft health points: 2.0 health = 1 heart.
# Potion levels use the visible in-game level: 1 = level I, 2 = level II, 0 = disabled.

# Level rules.
levels:
  max-level: 4
  ability-unlock-level: 3
  level-zero-damage-multiplier: 0.65

# Permanent Arcane status bar above the hotbar.
status-bar:
  enabled: true
  update-ticks: 10
  style: arcane
  resource-pack-icons: true
  resource-pack-font: arcanesmp:status
  short-labels: true
  single-arcane-compact: true
  compact-dual-style: true

# Breeze Arcane balance.
breeze:
  cooldown-seconds: 25
  dash-distance:
    # Target dash feel. The listener converts this into velocity with velocity-divisor.
    level-3: 14.0
    level-4: 21.0
  dash-damage: 4.0
  hit-radius: 1.65
  hit-step-spacing: 0.3
  damage-window-ticks: 24
  velocity-divisor: 5.5
  min-y-velocity: 0.35
  trail-duration-ticks: 14
  wind-movement:
    task-period-ticks: 2
    climb-vertical-boost: 0.045
    climb-max-up-velocity: 0.32
    swim-horizontal-multiplier: 1.06
    swim-max-horizontal-speed: 0.44
    glide-horizontal-multiplier: 1.02
    glide-max-horizontal-speed: 2.15
  knockback:
    horizontal: 1.0
    vertical: 0.35
  particles:
    launch-cloud: 35
    launch-gust: 20
    trail-cloud: 6
    trail-gust: 3
    landing-cloud: 20
    hit-cloud: 25
    finish-cloud: 35

# Luck Arcane balance.
luck:
  cooldown-seconds: 60
  active-hits: 5
  negates:
    level-3: 2
    level-4: 3
  passive:
    hero-level: 10
    effect-duration-ticks: 60
  particles:
    lucky-save: 20
    activate: 40

# Frost Arcane balance.
frost:
  cooldown-seconds: 75
  passive:
    speed-level:
      level-3: 1
      level-4: 2
    effect-duration-ticks: 60
  radius:
    level-3: 5
    level-4: 10
  freeze-duration:
    level-3: 3
    level-4: 3
  total-damage:
    level-3: 0.0
    level-4: 4.0
  freeze-effects:
    slowness-level: 255
    jump-boost-level: 129
  particles:
    cast-delay-ticks: 4
    cast-snowflake: 40
    ring-points: 48
    ring-snowflake: 4
    ring-snowball: 2
    target-snowflake: 35
    target-snowball: 20

# Ember Arcane balance.
ember:
  cooldown-seconds: 120
  passive:
    fire-resistance-level: 1
    effect-duration-ticks: 60
  beam-range: 15
  cast-delay-ticks: 6
  beam-step: 0.35
  beam-steps-per-tick: 4
  hit-radius: 1.3
  fire-ticks:
    level-3: 80
    level-4: 120
  damage:
    level-3: 6.0
    level-4: 8.0
  knockback:
    horizontal: 0.4
    vertical: 0.12
  particles:
    cast-flame: 45
    hit-flame: 35
    beam:
      flame: 16
      small-flame: 10
      smoke: 8
      ash: 5
      lava: 1
      dust: 8
      dust-size: 1.2

# Void Arcane balance.
void:
  passive:
    extra-hearts: 5
  flight:
    launch-strength: 1.6
    min-y-velocity: 0.6
    fly-speed: 0.22
    duration-seconds: 3
    cooldown-seconds: 30
  breath:
    duration-ticks: 60
    pulse-interval-ticks: 10
    total-damage: 12.0
    range: 10
    max-width: 6.0
    point-spacing: 0.35
    hit-radius: 1.2
    cooldown-seconds: 60
    knockback:
      horizontal: 0.25
      vertical: 0.06
  particles:
    # Passive Void aura particle interval. 20 ticks = 1 second, 0 = disabled.
    passive-interval-ticks: 80
    passive-portal: 1
    passive-sculk-soul: 1
    flight-launch-portal: 3
    flight-launch-smoke: 1
    flight-burst-portal: 25
    # Void Breath visual interval. Damage still uses void.breath.pulse-interval-ticks.
    breath-interval-ticks: 20
    breath-witch: 4
    breath-reverse-portal: 3
    breath-smoke: 1

# Custom armor and weapon balance.
custom-items:
  # How often equipped custom armor shows passive particles. 20 ticks = 1 second, 0 = disabled.
  particle-interval-ticks: 80
  heart-helmet:
    bonus-hearts: 5
    particles:
      dust: 2
      dust-size: 0.8
  resistance-chestplate:
    resistance-level: 1
    effect-duration-ticks: 60
    particles:
      portal: 3
  haste-leggings:
    haste-level: 2
    effect-duration-ticks: 60
    particles:
      happy-villager: 2
  speed-boots:
    speed-level: 3
    effect-duration-ticks: 60
    particles:
      cloud: 2
      dust: 1
      dust-size: 0.8
  strength-axe:
    strength-level: 1
    effect-duration-ticks: 60

# Cosmetic kill effect particle amounts.
kill-effects:
  breeze:
    cloud: 45
    sweep-attack: 8
  frost:
    snowflake: 60
    snowball: 25
  ember:
    flame: 55
    smoke: 35
  luck:
    happy-villager: 45
  void:
    portal: 80
    sculk-soul: 25

# Trader GUI balance and particles.
trader:
  animation-ticks: 30
  animation-period-ticks: 2
  reward-particles: 100

# Trader reward weights. These do not need to add up to 100.
trader-chances:
  breeze: 25
  frost: 25
  ember: 25
  luck: 25
